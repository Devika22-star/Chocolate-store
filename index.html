<!DOCTYPE html>
<html>
<head>
    <title>Chocolate Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Chocolate Store</h1>

<div class="products">
    <div class="card">
        <h3>Dairy Milk</h3>
        <p>₹50</p>
        <button onclick="addToCart('Dairy Milk', 50)">Add to Cart</button>
    </div>

    <div class="card">
        <h3>KitKat</h3>
        <p>₹40</p>
        <button onclick="addToCart('KitKat', 40)">Add to Cart</button>
    </div>

    <div class="card">
        <h3>Snickers</h3>
        <p>₹60</p>
        <button onclick="addToCart('Snickers', 60)">Add to Cart</button>
    </div>
     <div class="card">
        <h3>5 Star</h3>
        <p>₹60</p>
        <button onclick="addToCart('5 Star', 10)">Add to Cart</button>
    </div>
     <div class="card">
        <h3>Milky Bar</h3>
        <p>₹60</p>
        <button onclick="addToCart('Milky Bar', 60)">Add to Cart</button>
    </div>
</div>

<h2> Your Cart</h2>
<ul id="cart"></ul>

<h3 id="total">Total: ₹0</h3>

<script src="script.js"></script>
</body>
</html>
